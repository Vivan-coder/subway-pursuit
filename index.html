const W = 480, H = 800;

let cssScale = 1, dpr = 1;
function resize() {
  cssScale = Math.min(innerWidth / W, innerHeight / H);
  dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * cssScale) + 'px';
  cv.style.height = Math.floor(H * cssScale) + 'px';
  cv.width = Math.round(W * cssScale * dpr);
  cv.height = Math.round(H * cssScale * dpr);
}

/* ---------- camera / projection ---------- */
const F = 480, CB = 8, CAMY = 4.5, HZ = 330, LW = 2.2, SPAWN = 95;
let camX = 0, shakeX = 0, shakeY = 0;
function P(x, y, z) {
  const d = z + CB, s = F / d;
  return [W / 2 + (x - camX) * s + shakeX, HZ + (CAMY - y) * s + shakeY, s];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const laneX = l => (l - 1) * LW;
const fog = z => 1 - clamp((z - 30) / 70, 0, 0.9);

/* ---------- colours ---------- */
const cc = {};
function shade(h, f) {
  const n = parseInt(h.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f | 0);
  const g = Math.min(255, ((n >> 8) & 255) * f | 0);
  const b = Math.min(255, (n & 255) * f | 0);
  return `rgb(${r},${g},${b})`;
}
function mk(h) {
  return cc[h] || (cc[h] = {
    front: shade(h, 1), side: shade(h, 0.66), top: shade(h, 1.22),
    fT: shade(h, 1.15), fB: shade(h, 0.68), sT: shade(h, 0.8), sB: shade(h, 0.42)
  });
}
function gpoly(pts, c0, c1) {
  let mn = 1e9, mx = -1e9;
  for (const q of pts) { if (q[1] < mn) mn = q[1]; if (q[1] > mx) mx = q[1]; }
  mn = Math.max(mn, -2000); mx = Math.min(mx, 3000);
  if (mx - mn < 1) { poly(pts, c0); return; }
  const g = ctx.createLinearGradient(0, mn, 0, mx);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  poly(pts, g);
}

function poly(pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

/* ---------- 3D box (camera-facing front, one side, top) ---------- */
function box(x0, x1, y0, y1, z0, z1, c, win, seed) {
  const near = -CB + 0.35;
  if (z1 <= near) return;
  const zo = z0;
  let clipped = false;
  if (z0 < near) { z0 = near; clipped = true; }
  let fx = null;
  if (camX < x0) fx = x0; else if (camX > x1) fx = x1;
  if (fx !== null) {
    gpoly([P(fx, y0, z0), P(fx, y0, z1), P(fx, y1, z1), P(fx, y1, z0)], c.sT, c.sB);
    if (win) {
      let i = 0;
      for (let zz = zo + 0.7; zz + 0.9 < z1; zz += 1.8, i++) {
        if (zz < z0) continue;
        let j = 0;
        for (let yy = y0 + 0.8; yy + 1 < y1 - 0.3; yy += 1.7, j++) {
          const lit = ((i * 7 + j * 13 + seed) % 5) > 1;
          poly([P(fx, yy, zz), P(fx, yy, zz + 0.9), P(fx, yy + 1, zz + 0.9), P(fx, yy + 1, zz)],
               lit ? win : 'rgba(28,42,78,.85)');
        }
      }
    }
  }
  if (CAMY > y1) poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], c.top);
  if (!clipped) {
    gpoly([P(x0, y0, z0), P(x1, y0, z0), P(x1, y1, z0), P(x0, y1, z0)], c.fT, c.fB);
    if (win && z0 < 60) {
      let i = 0;
      for (let xx = x0 + 0.7; xx + 0.9 < x1; xx += 1.6, i++) {
        let j = 0;
        for (let yy = y0 + 0.8; yy + 1 < y1 - 0.3; yy += 1.7, j++) {
          const lit = ((i * 5 + j * 11 + seed) % 5) > 1;
          poly([P(xx, yy, z0), P(xx + 0.9, yy, z0), P(xx + 0.9, yy + 1, z0), P(xx, yy + 1, z0)],
               lit ? win : 'rgba(28,42,78,.85)');
        }
      }
    }
  }
}

/* ---------- audio ---------- */
let AC = null, muted = false;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type, v, slide, delay) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}

try { best = parseInt(localStorage.getItem('subwayPursuitBest') || '0', 10) || 0; } catch (e) {}

function init(lv) {
  level = lv || 0; theme = LEVELS[level].theme;
  S = 14; dist = 0; bonus = 0; coins = 0; arrests = 0;
  turboMax = 4; magnetMax = 7; dbl = false; lvIntro = 0; lightT = 0; lightCd = rnd(3, 6); dustT = 0;
  jet = 0; jetOn = false; combo = 0; comboT = 0; maxMult = 1; mis = [];
  gap = 14; hitT = 0; grace = 0; slowT = 0; turbo = 0; magnet = 0; shake = 0; flash = 0;
  bustT = 0; overT = 0; why = '';
  paintT = 0; popT = 0; splats = [];
  boss = false; bossHP = 0; bossIntro = 0;
  items = []; decos = []; parts = [];
  cursor = 32; dc = [-6, -6]; lc = -6;
  p = { lane: 1, prevLane: 1, x: 0, y: 0, vy: 0, roll: 0, rollT: 0, rollLand: false, phase: 0, tilt: 0, shield: 0, slip: 0 };
  kid = { dash: 0, dashCd: 8, pend2T: 0, stun: 0, pendT: 0, pendKind: '', lane: 1, x: 0, y: 0, vy: 0, roll: 0, phase: 0, laneT: 1, throwT: 0, throwCd: 4, talkCd: 2.5, say: '', sayLeft: 0, caught: false };
  camX = 0;
  scrollWorld(0, false);
}

/* ---------- world generation ---------- */
let idc = 0;
function addCoin(l, z, y) { items.push({ type: 'coin', lane: l, x: laneX(l), z, y: y === undefined ? 0.9 : y, len: 0, ph: Math.random() * 6.28 }); }
function addObs(type, l, z, extra) { const o = Object.assign({ type, lane: l, x: laneX(l), z, len: 0.5, id: ++idc }, extra || {}); items.push(o); return o; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function spawnRow(z) {
  const r = Math.random();
  const lanes = shuffle([0, 1, 2]);
  let rowLen = 3;
  if (Math.random() < LV().gaunt) {                   // gauntlet: back-to-back jump + roll
    addObs('barrier', lanes[0], z, { v: 0, len: 0.4, h: 0.95 });
    addObs('bar', lanes[0], z + 14, { len: 0.4 });
    addObs('pit', lanes[1], z, { len: 3 });
    addObs('barrier', lanes[1], z + 14, { v: 2, len: 0.8, h: 0.95 });
    addObs('train', lanes[2], z, { len: 10, color: TRAIN_COLORS[Math.random() * TRAIN_COLORS.length | 0], seed: Math.random() * 50 | 0 });
    rowLen = 16;
  } else if (r < 0.14) {                              // coin run
    const n = 6 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) addCoin(lanes[0], z + i * 1.8);
    if (Math.random() < 0.4) for (let i = 0; i < 4; i++) addCoin(lanes[1], z + 3 + i * 1.8);
    rowLen = n * 1.8;
  } else if (r < 0.34) {                              // trains
    const nt = Math.random() < LV().train2 ? 2 : 1;
    for (let i = 0; i < nt; i++) addObs('train', lanes[i], z, { len: 10, color: TRAIN_COLORS[Math.random() * TRAIN_COLORS.length | 0], seed: Math.random() * 50 | 0 });
    for (let i = 0; i < 5; i++) addCoin(lanes[nt], z + i * 2);
    rowLen = 10;
  } else if (r < 0.50) {                              // low barriers (jump)
    const nb = Math.random() < 0.6 ? 2 : 1;
    for (let i = 0; i < nb; i++) {
      const v = Math.random() < 0.5 ? 0 : 2;
      addObs('barrier', lanes[i], z, { v, len: v === 0 ? 0.4 : 0.8, h: 0.95 });
    }
    for (let j = 0; j < 5; j++) addCoin(lanes[0], z - 2.4 + j * 1.3, 0.9 + 1.4 * Math.sin(Math.PI * j / 4));
    if (nb === 1) for (let j = 0; j < 4; j++) addCoin(lanes[2], z + j * 1.8);
    rowLen = 3;
  } else if (r < 0.64) {                              // overhead bars (roll)
    const nb = 1 + (Math.random() * 3 | 0);
    for (let i = 0; i < nb; i++) {
      addObs('bar', lanes[i], z, { len: 0.4 });
      for (let j = -1; j <= 1; j++) addCoin(lanes[i], z + j * 1.1, 0.5);
    }
    for (let i = nb; i < 3; i++) for (let j = 0; j < 3; j++) addCoin(lanes[i], z + j * 1.8);
    rowLen = 3;
  } else if (r < 0.76) {                              // mixed
    addObs('train', lanes[0], z, { len: 10, color: TRAIN_COLORS[Math.random() * TRAIN_COLORS.length | 0], seed: Math.random() * 50 | 0 });
    addObs('barrier', lanes[1], z + 3, { v: 0, len: 0.4, h: 0.95 });
    addObs('bar', lanes[2], z + 3, { len: 0.4 });
    rowLen = 10;
  } else if (r < 0.88) {                              // open pits (jump)
    const np = Math.random() < 0.5 ? 2 : 1;
    for (let i = 0; i < np; i++) addObs('pit', lanes[i], z, { len: 3 });
    for (let j = 0; j < 5; j++) addCoin(lanes[0], z - 0.5 + j * 1.0, 0.9 + 1.3 * Math.sin(Math.PI * j / 4));
    if (np === 1 && Math.random() < 0.5) {            // pit + train combo
      addObs('train', lanes[1], z, { len: 10, color: TRAIN_COLORS[Math.random() * TRAIN_COLORS.length | 0], seed: Math.random() * 50 | 0 });
      rowLen = 10;
    } else rowLen = 4;
  } else if (r < 0.96) {                              // cones + oil slicks
    const a = lanes[0], b = lanes[1];
    for (let i = 0; i < 3; i++) addObs('cone', a, z + i * 1.4, { len: 0.5 });
    addObs('oil', b, z + 1, { len: 2.5 });
    for (let i = 0; i < 4; i++) addCoin(lanes[2], z + i * 1.8);
    rowLen = 5;
  } else {                                            // coin wall
    for (let l = 0; l < 3; l++) for (let i = 0; i < 4; i++) addCoin(l, z + i * 1.8);
    rowLen = 7;
  }
  if (Math.random() < TUNE.lucky(save.up.lucky) / 100) {
    const type = ['turbo', 'magnet', 'shield', 'taser', 'donut', 'jetpack'][Math.random() * 6 | 0];
    items.push({ type, lane: lanes[0], x: laneX(lanes[0]), z: z + rowLen + 6, y: 1, len: 0 });
  }
  return rowLen;
}

function spawnDeco(i) {
  const side = i === 0 ? -1 : 1;
  const d = rnd(6, 16), w = rnd(4, 9), h = rnd(7, 24);
  const off = 5.8 + Math.random() * 1.2;
  const x0 = side < 0 ? -(off + w) : off;
  decos.push({ x0, x1: x0 + w, h, z: dc[i], d, col: theme.bcol[Math.random() * theme.bcol.length | 0], seed: Math.random() * 50 | 0, neon: Math.random() < theme.neon ? NEON[Math.random() * 3 | 0] : null });
  dc[i] += d + rnd(0.5, 2.5);
}

function scrollWorld(dt, spawnItems) {
  const dz = S * dt;
  for (const it of items) it.z -= dz + (it.vz || 0) * dt;
  for (const d of decos) d.z -= dz;
  for (const q of parts) q.z -= dz;
  cursor -= dz; dc[0] -= dz; dc[1] -= dz; lc -= dz;
  for (let i = 0; i < 2; i++) while (dc[i] < SPAWN + 40) spawnDeco(i);
  while (lc < SPAWN + 40) {
    decos.push({ lamp: true, x0: -4.6, x1: -4.6, h: 4.4, z: lc, d: 0.2 });
    decos.push({ lamp: true, x0: 4.6, x1: 4.6, h: 4.4, z: lc, d: 0.2 });
    lc += 16;
  }
  if (spawnItems) {
    while (cursor < SPAWN) {
      const len = spawnRow(cursor);
      cursor += len + Math.max(LV().sp, S * 0.6) + rnd(0, 3);
    }
  }
  items = items.filter(it => !it.taken && it.z + it.len > -CB + 0.5 && it.z > -30);
  decos = decos.filter(d => d.z + d.d > -CB + 0.5);
}

/* ---------- particles ---------- */
function burst(x, y, z, col, n, sp) {
  for (let i = 0; i < n; i++) {
    parts.push({ x, y, z, vx: rnd(-1, 1) * sp, vy: rnd(0.2, 1) * sp, vz: rnd(-0.5, 1) * sp, life: rnd(0.4, 0.8), max: 0.8, col, size: rnd(0.08, 0.16) });
  }
}

/* ---------- player actions ---------- */
function move(d) {
  if (state !== 'play') return;
  const nl = clamp(p.lane + d, 0, 2);
  if (nl === p.lane) return;
  p.prevLane = p.lane; p.lane = nl;
  sfx.move();
}
function jump() {
  if (state !== 'play' || jetOn) return;
  if (p.y <= 0.01) { p.vy = 11.5; p.y = 0.001; p.roll = 0; p.rollLand = false; sfx.jump(); missionAdd('jumps', 1); }
}
function rollAct() {
  if (state !== 'play' || jetOn) return;
  if (p.y > 0.01) { p.vy = -20; p.rollLand = true; }
  else { p.roll = 0.65; p.rollT = 0; sfx.roll(); missionAdd('rolls', 1); }
}

/* ---------- hit handling ---------- */
function popup(t, c) { popTxt = t; popCol = c || '#fff'; popT = 1.3; }
function splash() {
  paintT = 3.2; slowT = Math.max(slowT, 0.3); shake = 0.3; splats = [];
  const cols = ['#ff3d9a', '#35e0ff', '#9cff3d', '#ffd23f'];
  for (let i = 0; i < 9; i++) splats.push({ x: rnd(30, W - 30), y: rnd(120, H - 120), r: rnd(40, 110), c: cols[i % 4] });
  kid.say = 'Nice color, officer!'; kid.sayLeft = 1.8;
  sfx.hit();
}
function hit(it) {
  if (it) it.hit = true;
  if (p.shield > 0) {
    p.shield--; grace = 1.0; shake = 0.3; sfx.hit();
    burst(p.x, p.y + 0.9, 0.5, '#7fd8ff', 20, 5);
    popup(p.shield > 0 ? `SHIELD HOLDS! ${p.shield} LEFT` : 'SHIELD BROKE!', '#7fd8ff');
    return;
  }
  if (hitT > 0) { gameOver('crash'); return; }
  combo = 0; comboT = 0;
  hitT = 4; grace = 1.0; slowT = 0.9; gap += 3; shake = 0.45; flash = 0.35;
  sfx.hit();
  burst(p.x, p.y + 0.9, 0.5, '#ffffff', 14, 4);
  kid.say = HIT_TAUNTS[Math.random() * HIT_TAUNTS.length | 0]; kid.sayLeft = 1.8;
}

function gameOver(reason) {
  state = 'over'; why = reason; overT = 0; paintT = 0;
  const sc = scoreNow();
  if (sc > best) { best = sc; try { localStorage.setItem('subwayPursuitBest', String(best)); } catch (e) {} }
  sfx.over();
}
const scoreNow = () => Math.floor(dist * 0.5 + bonus);

function bossTackle() {
  bossHP--; bonus += 300;
  burst(kid.x, 1.2, gap, '#ffd23f', 26, 6);
  gap = 15 + (bossMax - bossHP) * 1.5; kid.stun = 1.6; shake = 0.5; grace = 1.0;
  kid.say = ['OW!! You\'ll pay for that!', 'That\'s ILLEGAL!', 'I\'m telling my dad!'][Math.random() * 3 | 0]; kid.sayLeft = 2;
  kid.pendKind = 'barrage'; kid.pendT = 2.2;                       // he retaliates
  popup(`TACKLED! ${bossHP} HIT${bossHP > 1 ? 'S' : ''} LEFT`, '#ffd23f');
  sfx.power(); sfx.hit();
}
function startBust() {
  state = 'bust'; bustT = 2.4; kid.caught = true;
  burst(kid.x, 1.2, gap, '#ffd23f', 24, 5);
  sfx.bust();
}
/* ---------- level flow ---------- */
function applyLevel() {
  const L = LV();
  theme = L.theme;
  gap = L.gap;
  boss = L.boss > 0; bossMax = L.boss; bossHP = L.boss;
  lvIntro = 3.2; bossIntro = boss ? 3.2 : 0;
  const notes = [];
  if (save.inv.shieldstart > 0) { save.inv.shieldstart--; p.shield = TUNE.shield(save.up.shield); notes.push('🔰 Ready Shield'); }
  if (save.inv.headstart > 0) { save.inv.headstart--; turboMax = turbo = 3 + 0.5 * save.up.turbo; notes.push('🏁 Head Start'); }
  rollMissions();
  kid.say = KID_LINES.intro[level]; kid.sayLeft = 2.8;
  if (save.inv.doubler > 0) { save.inv.doubler--; dbl = true; notes.push('💰 Coin Doubler'); }
  if (notes.length) popup(notes.join('  '), '#ffe27a');
  persist();
  if (boss) sfx.siren(true);
}
function rollMissions() {
  const tier = Math.min(2, level >> 1);
  mis = shuffle(MISSION_POOL.slice()).slice(0, 2).map(def => ({ def, n: def.n[tier], prog: 0, done: false, reward: 15 + 10 * level }));
}
function missionCheck(m) {
  if (m.done || m.prog < m.n) return;
  m.done = true; save.wallet += m.reward; persist();
  popup(`✅ MISSION DONE  +${m.reward} coins`, '#7dffa0'); sfx.power();
}
function missionAdd(key, v) { for (const m of mis) if (!m.done && m.def.key === key) { m.prog = Math.min(m.n, m.prog + v); missionCheck(m); } }
function missionMax(key, v) { for (const m of mis) if (!m.done && m.def.key === key) { m.prog = Math.min(m.n, Math.max(m.prog, v)); missionCheck(m); } }
const comboMult = () => 1 + Math.min(4, Math.floor(combo / 8));
function newGame(lv, carry) {
  ensureAudio();
  const c = carry || { bonus: 0, dist: 0, arrests: 0 };
  init(lv);
  bonus = c.bonus; dist = c.dist; arrests = c.arrests;
  applyLevel();
  state = 'play';
}
function start() { newGame(Math.min(selLevel, save.unlocked)); }
function toMenu() { selLevel = clamp(selLevel, 0, save.unlocked); init(selLevel); state = 'menu'; }

function levelComplete() {
  arrests++;
  lastReward = 30 + 20 * level;
  save.wallet += lastReward;
  bonus += 1000 * (level + 1) + (boss ? 2000 : 0);
  save.unlocked = Math.max(save.unlocked, Math.min(4, level + 1));
  const sc = scoreNow();
  if (sc > best) { best = sc; try { localStorage.setItem('subwayPursuitBest', String(best)); } catch (e) {} }
  persist();
  if (level >= LEVELS.length - 1) { state = 'victory'; victoryT = 0; sfx.bust(); }
  else openShop('complete');
}
function openShop(from) { shopFrom = from; shopSel = 0; shopMsg = ''; shopMsgT = 0; state = 'shop'; persist(); }
function shopDone() {
  persist();
  if (shopFrom === 'complete') newGame(level + 1, { bonus, dist, arrests });
  else if (shopFrom === 'over') newGame(level);
  else toMenu();
}
function buy(i) {
  const it = SHOP[i];
  const c = shopCost(it);
  const say = (m, ok) => { shopMsg = m; shopMsgT = 2; if (!ok) sfx.hit(); };
  if (it.kind === 'up' && save.up[it.id] >= MAXUP) return say(`${it.name} is already maxed!`, false);
  if (it.kind === 'inv' && save.inv[it.id] >= 5) return say('You can carry at most 5 of those!', false);
  if (save.wallet < c) return say(`Need ${c - save.wallet} more coins!`, false);
  save.wallet -= c;
  if (it.kind === 'up') save.up[it.id]++; else save.inv[it.id]++;
  persist(); sfx.power();
  say(it.kind === 'up' ? `${it.name} upgraded to level ${save.up[it.id]}!` : `Bought ${it.name}!`, true);
}
function selectLevel(v) {
  if (v > save.unlocked) {                              // levels unlock strictly one after the other
    menuMsg = `LOCKED - clear level ${save.unlocked + 1} first`; menuMsgT = 2; sfx.hit(); return;
  }
  const n = clamp(v, 0, 4);
  if (n === selLevel) return;
  selLevel = n; init(selLevel); sfx.move();
}
function togglePause() {
  if (state === 'play') state = 'paused';
  else if (state === 'paused') state = 'play';
}

/* ---------- kid AI ---------- */
function laneHas(l, types, z0, z1) {
  return items.some(it => it.lane === l && types.includes(it.type) && it.z < z1 && it.z + it.len > z0);
}
/* ---------- trains: roofs the kid can run on, walls that stop projectiles ---------- */
const trainAt = (l, z) => items.find(t => t.type === 'train' && !t.taken && t.lane === l && z >= t.z - 0.3 && z <= t.z + t.len + 0.3);
const trainUnder = (x, z) => items.find(t => t.type === 'train' && !t.taken && Math.abs(t.x - x) < 1.15 && z >= t.z - 0.3 && z <= t.z + t.len + 0.3);
const surfaceY = (x, z) => trainUnder(x, z) ? 3.1 : 0;
const kidKey = () => { const t = kid.y > 2.5 ? trainUnder(kid.x, gap) : null; return t ? t.z - 0.01 : gap; };   // draw him after the roof he stands on

function fireThrow(kind) {
  const lane = Math.random() < 0.75 ? p.lane : kid.lane;     // he aims at YOU
  if (kind === 'barrage') {                                  // boss: bottles in every lane
    shuffle([0, 1, 2]).forEach((l, i) => { if (!trainAt(l, gap - 0.5 + i * 3)) addObs('bottle', l, gap - 0.5 + i * 3, { len: 0.5, y: 1.1, vz: 11 }); });
    popup('⚠ BARRAGE! JUMP OR ROLL!', '#ff8080'); sfx.taunt();
    return;
  }
  if (kind === 'board') {                                    // skateboard sliding at you
    if (trainAt(lane, gap - 0.5)) return;
    addObs('board', lane, gap - 0.5, { len: 1.2, vz: 14 });
    popup('⚠ SKATEBOARD!', '#ffb36b'); sfx.taunt();
    return;
  }
  if (kind === 'bottle' || kind === 'paint') {
    if (trainAt(lane, gap - 0.5)) return;
    addObs(kind, lane, gap - 0.5, { len: 0.5, y: 1.1, vz: 11 });
    popup('⚠ INCOMING!', '#ff8080'); sfx.taunt();
    return;
  }
  const tz = gap - 1.8;
  if (tz <= 6 || laneHas(lane, ['train', 'barrier', 'bar', 'pit', 'cone', 'oil'], tz - 6, tz + 8)) return;
  if (kind === 'can') addObs('barrier', lane, tz, { v: 1, len: 0.8, h: 0.95 });
  else if (kind === 'oil') addObs('oil', lane, tz, { len: 2.5 });
  else for (let i = 0; i < 3; i++) addObs('cone', lane, tz + i * 1.3, { len: 0.5 });
}
function planThrow() {
  const pool = LV().kinds;
  let kind = pool[Math.random() * pool.length | 0];
  if (boss && Math.random() < 0.3) kind = 'barrage';
  kid.pendKind = kind;
  kid.pendT = 0.4; kid.throwT = 0.45;
}
function updateKid(dt) {
  if (kid.stun <= 0) kid.phase += (S * 0.55 + 2) * dt;
  kid.laneT -= dt;
  const onRoof = kid.y > 2.5;
  const freeLane = l => !laneHas(l, ['train'], gap - 1.2, gap + 10);
  // A train wall is about to hit him: climb onto the roof or dodge sideways (decided once per train)
  if (!kid.caught && kid.stun <= 0 && !onRoof) {
    const wall = items.find(it => it.type === 'train' && !it.taken && it.lane === kid.lane && it.z > gap + 1.5 && it.z < gap + 11);
    if (wall) {
      if (!kid.plan || kid.plan.id !== wall.id) kid.plan = { id: wall.id, mode: Math.random() < 0.5 ? 'climb' : 'dodge' };
      if (kid.plan.mode === 'dodge') {
        const opts = [kid.lane - 1, kid.lane + 1].filter(l => l >= 0 && l <= 2 && freeLane(l));
        if (opts.length) kid.lane = opts[Math.random() * opts.length | 0]; else kid.plan.mode = 'climb';
      }
      if (kid.plan.mode === 'climb' && kid.y <= 0.01 && wall.z < gap + 8.5) { kid.vy = 15.5; kid.y = 0.001; }
    }
  }
  if (kid.laneT <= 0 && !kid.caught && kid.stun <= 0) {
    kid.laneT = rnd(0.3, 0.6);
    if (Math.random() < (onRoof ? 0.3 : 0.2)) {
      const opts = [kid.lane - 1, kid.lane + 1].filter(l => l >= 0 && l <= 2 && (onRoof || freeLane(l)));
      if (opts.length) kid.lane = opts[Math.random() * opts.length | 0];
    }
  }
  kid.x += (laneX(kid.lane) - kid.x) * Math.min(1, dt * 10);
  if (!kid.caught) {
    if (kid.y <= 0.01 && laneHas(kid.lane, ['barrier'], gap - 0.5, gap + 3.5)) { kid.vy = 9.5; kid.y = 0.001; }
    if (laneHas(kid.lane, ['bar'], gap - 0.5, gap + 3.5)) kid.roll = 0.5;
  }
  const sy = surfaceY(kid.x, gap);                       // roof height under him (0 = ground)
  if (kid.y > sy + 0.001 || kid.vy > 0) { kid.vy -= 34 * dt; kid.y += kid.vy * dt; }
  if (kid.y < sy) { kid.y = sy; if (kid.vy < 0) kid.vy = 0; }
  if (kid.roll > 0) kid.roll -= dt;
  if (kid.throwT > 0) kid.throwT -= dt;

  // he harasses you: cans, bottles, paint balloons, oil, cones
  if (kid.stun <= 0) kid.throwCd -= dt;
  if (kid.throwCd <= 0 && !kid.caught) {
    kid.throwCd = Math.max(0.9, rnd(1.8, 3.4) * LV().throw * (boss ? 0.75 : 1));
    planThrow();
  }
  if (kid.pendT > 0) {
    kid.pendT -= dt;
    if (kid.pendT <= 0 && !kid.caught) {
      fireThrow(kid.pendKind);
      if (LV().dbl && kid.pendKind !== 'barrage' && Math.random() < 0.3) kid.pend2T = 0.55;   // double throw
    }
  }
  if (kid.pend2T > 0) { kid.pend2T -= dt; if (kid.pend2T <= 0 && !kid.caught) fireThrow(Math.random() < 0.5 ? 'bottle' : 'paint'); }
  // taunt dash: he sprints off to rub it in
  kid.dash -= dt; kid.dashCd -= dt;
  if (kid.dashCd <= 0 && !kid.caught && kid.stun <= 0) {
    kid.dashCd = rnd(12, 18); kid.dash = 1.2; kid.say = 'Zoom zoom, slowpoke!'; kid.sayLeft = 1.5; sfx.taunt();
  }
  kid.talkCd -= dt;
  if (kid.talkCd <= 0) {
    kid.talkCd = rnd(4, 7);
    if (kid.sayLeft <= 0) {
      const pool = boss ? BOSS_TAUNTS : TAUNTS;
      let t = pool[Math.random() * pool.length | 0];
      if (!boss && Math.random() < 0.3) t = coins < 15 ? `Only ${coins} coins? LOL` : `Level ${level + 1}? Dream on!`;
      kid.say = t; kid.sayLeft = 1.9; sfx.taunt();
    }
  }
  if (kid.sayLeft > 0) kid.sayLeft -= dt;
}

/* ---------- update ---------- */
function updateParts(dt) {
  for (const q of parts) {
    q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vy -= 12 * dt;
  }
  parts = parts.filter(q => q.life > 0);
}

let sirenT = 0, sirenHi = false;
function update(dt) {
  time += dt;
  updateParts(dt);
  lightT = Math.max(0, lightT - dt);
  if (shopMsgT > 0) shopMsgT -= dt;
  camX += (p.x * 0.55 - camX) * Math.min(1, dt * 6);

  if (state === 'victory') victoryT += dt;
  if (state === 'menu' || state === 'shop' || state === 'victory') {
    S = 10; dist += S * dt; scrollWorld(dt, false);
    p.phase += S * 0.55 * dt; kid.phase += S * 0.55 * dt;
    kid.x = Math.sin(time * 0.8) * 0.8;
    return;
  }
  if (state === 'over') { overT += dt; shake = Math.max(0, shake - dt); return; }
  if (state === 'paused') return;
  if (state === 'bust') {
    bustT -= dt;
    S += (3 - S) * Math.min(1, dt * 3);
    scrollWorld(dt, false);
    gap += (1.3 - gap) * Math.min(1, dt * 6);
    kid.x += (p.x - kid.x) * Math.min(1, dt * 5);
    p.phase += S * 0.55 * dt;
    shake = Math.max(0, shake - dt);
    if (bustT <= 0) levelComplete();
    return;
  }

  /* ----- playing ----- */
  hitT = Math.max(0, hitT - dt); grace -= dt; slowT -= dt; turbo -= dt; magnet -= dt;
  paintT -= dt; popT -= dt; p.slip -= dt; kid.stun -= dt; bossIntro -= dt; lvIntro -= dt; jet -= dt;
  if (menuMsgT > 0) menuMsgT -= dt;
  comboT -= dt; if (comboT <= 0) combo = 0;
  if (jetOn && jet <= 0) {                               // never drop the jetpack while over a train roof
    const roof = items.some(t => t.type === 'train' && !t.taken && Math.abs(t.x - p.x) < 1.15 && t.z < 4 && t.z + t.len > -1.5);
    if (roof) jet = 0.25; else { jetOn = false; grace = Math.max(grace, 0.8); }
  }
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  if (theme.lightning) { lightCd -= dt; if (lightCd <= 0) { lightT = 0.45; lightCd = rnd(4, 9); sfx.thunder(); } }
  if (p.y <= 0.01 && !(p.roll > 0)) {                    // dust kicked up by running feet
    dustT -= dt;
    if (dustT <= 0) {
      dustT = 0.06;
      parts.push({ x: p.x + rnd(-0.3, 0.3), y: 0.05, z: -0.3, vx: rnd(-0.6, 0.6), vy: rnd(0.3, 1.0), vz: rnd(-1, 0), life: 0.35, max: 0.35, col: theme.dust, size: rnd(0.05, 0.11) });
    }
  }

  const base = LV().speed;
  const target = base * (turbo > 0 ? 1.35 : 1) * (jetOn ? 1.2 : 1) * (slowT > 0 ? 0.4 : 1);
  S += (target - S) * Math.min(1, dt * 3);
  dist += S * dt;
  scrollWorld(dt, true);
  if (jetOn) {                                           // coin shower in front of the jetpack
    jetCur -= S * dt;
    while (jetCur < 36) { addCoin(p.lane, jetCur, 4.4); items[items.length - 1].sky = true; jetCur += 4; }
  }
  for (const it of items) {                              // bottles / paint / boards shatter on trains
    if (!it.vz || it.taken) continue;
    if (trainAt(it.lane, it.z)) { it.taken = true; burst(it.x, it.y || 0.5, Math.max(it.z, 0.4), '#cfe3ff', 10, 4); }
  }

  // player motion
  p.x += (laneX(p.lane) - p.x) * Math.min(1, dt * (p.slip > 0 ? 3.5 : 15));
  p.tilt = (laneX(p.lane) - p.x) * 0.08;
  if (jetOn) { p.vy = 0; p.y += (4.3 - p.y) * Math.min(1, dt * 6); }
  else if (p.y > 0 || p.vy > 0) {
    p.vy -= 34 * dt; p.y += p.vy * dt;
    if (p.y <= 0) { p.y = 0; p.vy = 0; if (p.rollLand) { p.roll = 0.55; p.rollT = 0; p.rollLand = false; } }
  }
  if (p.roll > 0) { p.roll -= dt; p.rollT += dt; }
  p.phase += S * 0.55 * dt;

  // gap with the kid
  let kidAdv = LV().adv + (boss ? 0.25 : 0);
  if (kid.stun > 0) kidAdv = -1.5;
  else { if (gap < 5) kidAdv += 0.8; if (kid.dash > 0) kidAdv += 1.5; }                    // he panics and sprints when you get close
  gap += (kidAdv - (turbo > 0 ? 3.5 : 0) - (jetOn ? 1.5 : 0) + (slowT > 0 ? 4 : 0)) * dt;

  updateKid(dt);

  // turbo siren
  if (turbo > 0) {
    sirenT -= dt;
    if (sirenT <= 0) { sirenT = 0.28; sirenHi = !sirenHi; sfx.siren(sirenHi); }
  }

  // collisions & pickups
  const ph = p.roll > 0 ? 0.7 : 1.75;
  for (const it of items) {
    if (it.taken) continue;
    if (PICK.has(it.type)) {
      if (magnet > 0 && it.z > -1 && it.z < 14 + 2 * save.up.magnet && Math.abs(it.x - p.x) < LW * (1.2 + 0.2 * save.up.magnet)) {
        it.x += (p.x - it.x) * Math.min(1, dt * 9);
        it.z -= 12 * dt;
        it.y += (p.y + 0.9 - it.y) * Math.min(1, dt * 9);
      }
      if (Math.abs(it.z) < 0.9 && Math.abs(it.x - p.x) < 0.85 && (jetOn || (it.y >= p.y - 0.2 && it.y <= p.y + ph))) {
        it.taken = true;
        if (it.type !== 'coin') missionAdd('power', 1);
        if (it.type === 'coin') {
          const v = dbl ? 2 : 1;
          combo++; comboT = 1.6; const mult = comboMult(); maxMult = Math.max(maxMult, mult);
          coins += v; save.wallet += v; bonus += 10 * v * mult; if (!it.sky) gap = Math.max(0, gap - TUNE.cardio(save.up.cardio)); sfx.coin();
          missionAdd('coins', v); missionMax('mult', mult);
          burst(it.x, it.y, 0.4, '#ffd23f', 4, 2.5);
        } else if (it.type === 'jetpack') {
          jetOn = true; jetMax = jet = 3.5; jetCur = 36; p.roll = 0; p.rollLand = false;
          sfx.power(); burst(p.x, 1, 0.4, '#ffb36b', 18, 5); popup('🚀 JETPACK! Fly over everything', '#ffb36b');
        } else if (it.type === 'turbo') {
          turboMax = turbo = TUNE.turbo(save.up.turbo); sfx.power(); burst(p.x, 1, 0.4, '#4aa3ff', 16, 5);
        } else if (it.type === 'magnet') {
          magnetMax = magnet = TUNE.magnet(save.up.magnet); sfx.power(); burst(p.x, 1, 0.4, '#ff5a5a', 16, 5);
        } else if (it.type === 'shield') {
          p.shield = TUNE.shield(save.up.shield); sfx.power(); burst(p.x, 1, 0.4, '#7fd8ff', 16, 5); popup(`🛡️ SHIELD x${p.shield}!`, '#7fd8ff');
        } else if (it.type === 'taser') {
          const tg = TUNE.taser(save.up.taser);
          burst(kid.x, 1.2, gap, '#ffe94a', 24, 6);
          gap = Math.max(0, gap - tg); kid.stun = TUNE.taserStun(save.up.taser); kid.say = 'AAAH! Not fair!'; kid.sayLeft = 2;
          sfx.power(); popup(`⚡ TASED HIM! -${tg} m`, '#ffe94a');
        } else {
          const dg = TUNE.donut(save.up.donut);
          gap = Math.max(0, gap - dg); bonus += 50; sfx.power(); burst(p.x, 1, 0.4, '#ff9ccf', 14, 4);
          popup(`🍩 YUM! -${dg} m`, '#ffb3de');
        }
      }
      continue;
    }
    if (jetOn || it.hit) continue;                       // flying over everything
    if (!(it.z < 0.45 && it.z + it.len > -0.45)) continue;
    if (Math.abs(it.x - p.x) >= 0.9) continue;
    let bad = false;
    if (it.type === 'barrier') bad = p.y < it.h - 0.15;
    else if (it.type === 'bar') bad = p.y < 2.0 && !(p.roll > 0 && p.y < 0.2);
    else if (it.type === 'train') bad = p.y < 3.0;
    else if (it.type === 'pit') bad = p.y < 0.3;
    else if (it.type === 'cone') bad = p.y < 0.6;
    else if (it.type === 'bottle' || it.type === 'paint') bad = !(p.roll > 0) && p.y < 0.9;
    else if (it.type === 'board') bad = p.y < 0.35;
    else if (it.type === 'oil') {
      if (p.y < 0.1) {
        it.hit = true; p.slip = 1.8; popup('SLIPPERY!', '#c9a6ff');
        kid.say = 'Wheeeee! Slip!'; kid.sayLeft = 1.6;
      }
      continue;
    }
    if (!bad) continue;
    if (turbo <= 0 && it.type === 'cone') {          // cones: small stumble, not a full hit
      it.taken = true; slowT = Math.max(slowT, 0.5); gap += 1.5; shake = 0.2; sfx.hit();
      burst(it.x, 0.5, 0.4, '#ff7a1a', 8, 3);
      continue;
    }
    if (turbo <= 0 && it.type === 'paint') {         // paint balloon: blinds you
      it.taken = true; splash();
      continue;
    }

    if (turbo > 0) {                                  // smash through while on turbo
      it.taken = true; bonus += 25; shake = 0.2; sfx.hit();
      burst(it.x, 1, Math.max(0.4, it.z), '#ffffff', 18, 6);
      continue;
    }
    if (grace > 0) continue;
    if (it.type === 'train' && it.z < -0.2) {          // side bump -> bounced back to previous lane
      p.lane = p.prevLane;
      hit(null);
    } else {
      hit(it);
    }
    if (state === 'over') return;
  }

  if (gap <= 2.0) {
    if (boss && bossHP > 1) bossTackle();
    else { startBust(); return; }
  }
  if (gap >= 38) { gameOver('escape'); return; }
}

/* ---------- characters (seen from behind) ---------- */

    g.addColorStop(0, shade(col, 1.22)); g.addColorStop(0.45, shade(col, 1)); g.addColorStop(1, shade(col, 0.66));

    g.addColorStop(0, shade(col, 1.35)); g.addColorStop(0.5, shade(col, 1)); g.addColorStop(1, shade(col, 0.6));

function person(x, y, z, o) {
  const [sx, sy, s] = P(x, y, z);
  const gy = P(x, o.gnd || 0, z)[1];                     // shadow sits on whatever he is standing on
  ctx.globalAlpha = fog(z);
  ctx.save(); ctx.translate(sx + 0.15 * s * o.sc, gy); ctx.scale(1, 0.3);
  const shg = ctx.createRadialGradient(0, 0, 0, 0, 0, 0.75 * s * o.sc * (1 - Math.min(0.4, (y - (o.gnd || 0)) * 0.15)));
  shg.addColorStop(0, 'rgba(0,0,0,.6)'); shg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = shg; ctx.beginPath(); ctx.arc(0, 0, 0.75 * s * o.sc, 0, 6.2832); ctx.fill(); ctx.restore();
  if (o.blink && Math.floor(time * 14) % 2 === 0) ctx.globalAlpha *= 0.35;
  ctx.save();
  ctx.translate(sx, sy);
  const u = s * o.sc;
  ctx.scale(u, -u);
  ctx.rotate(o.tilt || 0);
  ctx.lineWidth = 0.028; ctx.strokeStyle = 'rgba(8,10,25,.55)'; ctx.lineJoin = 'round';

  if (o.aura) {
    const a = Math.floor(time * 6) % 2 === 0;
    const g = ctx.createRadialGradient(0, 0.9, 0.2, 0, 0.9, 1.5);
    g.addColorStop(0, o.zap ? 'rgba(255,240,60,.75)' : (a ? 'rgba(255,60,60,.5)' : 'rgba(60,120,255,.5)')); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0.9, 1.5, 0, 6.2832); ctx.fill();
  }

  if (o.roll > 0) {
    ctx.translate(0, 0.42);
    ctx.rotate(-o.rollT * 14);
    C(0, 0, 0.44, o.shirt);
    C(0, -0.22, 0.2, o.pants);
    C(0, 0.3, 0.2, o.hair);
  } else {
    const air = y - (o.gnd || 0) > 0.05;
    // legs
    for (const sd of [-1, 1]) {
      const lift = air ? (sd > 0 ? 0.3 : 0.05) : Math.max(0, Math.sin(o.phase + (sd > 0 ? Math.PI : 0))) * 0.3;
      R(sd * 0.17 - 0.11, lift, 0.22, 0.88 - lift, o.pants);

    ctx.translate(0, air ? 0 : 0.045 * Math.abs(Math.sin(o.phase)));
    R(-0.4, 0.82, 0.8, 0.7, o.shirt);
    R(-0.4, 0.82, 0.8, 0.1, '#111');
    R(0.33, 0.84, 0.07, 0.66, 'rgba(255,170,100,.38)');     // sunset rim light
    R(-0.3, 1.28, 0.02, 0.2, 'rgba(0,0,0,.16)'); R(0.22, 1.0, 0.02, 0.25, 'rgba(0,0,0,.14)');   // cloth folds
    if (o.kind === 'cop') {
      R(-0.4, 1.17, 0.8, 0.1, '#f4d03f');
      R(-0.02, 0.92, 0.04, 0.58, 'rgba(0,0,0,.25)');
      R(-0.3, 0.95, 0.6, 0.5, 'rgba(10,20,50,.4)');          // tactical vest
      R(-0.3, 1.3, 0.6, 0.03, 'rgba(255,255,255,.22)');
      R(0.2, 0.86, 0.15, 0.24, '#23262d');
      R(-0.34, 0.86, 0.13, 0.17, '#b8bcc6');
      R(-0.4, 1.44, 0.2, 0.08, '#f4d03f'); R(0.2, 1.44, 0.2, 0.08, '#f4d03f');
      ctx.save(); ctx.translate(0, 1.0); ctx.scale(0.01, -0.01);

      ctx.lineWidth = 0; ctx.fillText('POLICE', 0, 0);

    } else {
      R(-0.3, 0.92, 0.6, 0.58, o.pack);
      R(-0.3, 1.2, 0.6, 0.06, '#00000055');
    }
    if (o.jet) {                                         // jetpack + flames
      R(-0.34, 0.95, 0.28, 0.52, '#8a8f99'); R(0.06, 0.95, 0.28, 0.52, '#8a8f99');
      for (const fx of [-0.2, 0.2]) {

  for (const e of list) e.f();

  for (const q of parts) {

  else if (state === 'bust') drawBust();

    ctx.save(); ctx.translate(x, y); ctx.rotate(time * 3 + i); ctx.fillStyle = cols[i % 5]; ctx.fillRect(-3, -2, 7, 4); ctx.restore();
  }
  const pop = 1 + Math.max(0, 0.5 - victoryT) * 1.2;
  ctx.save(); ctx.translate(W / 2, 180); ctx.scale(pop, pop);
  T('CASE CLOSED!', 0, 0, 46, '#ffd23f', 'center');
  ctx.restore();
  T('You caught every kid in town.', W / 2, 224, 16, '#fff', 'center');
  E('🏆', W / 2, 290, 56);
  glass(60, 340, 360, 170, 16);
  T('SCORE', 90, 385, 16, '#cfe3ff', 'left'); T(String(scoreNow()), W - 90, 385, 26, '#fff', 'right');
  T('WALLET', 90, 425, 16, '#cfe3ff', 'left'); T(String(save.wallet), W - 90, 425, 26, '#ffe27a', 'right');
  T('ARRESTS', 90, 465, 16, '#cfe3ff', 'left'); T(String(arrests), W - 90, 465, 26, '#7dffa0', 'right');
  T('BEST', 90, 500, 16, '#cfe3ff', 'left'); T(String(Math.max(best, scoreNow())), W - 90, 500, 20, '#ffd23f', 'right');
  if (victoryT > 1) {
    T('SPACE / TAP: BACK TO MENU', W / 2, 580, 18, '#fff', 'center');
    T('S: SHOP', W / 2, 612, 14, '#9fe8ff', 'center');
  }
}
function drawPaused() {
  dim(0.6);
  T('PAUSED', W / 2, H / 2 - 10, 54, '#fff', 'center');
  T('Press P or tap to resume', W / 2, H / 2 + 34, 18, '#cfe3ff', 'center');
}
function drawBust() {
  const t = 2.4 - bustT;
  const k = LV().kid;
  ctx.fillStyle = `rgba(20,60,140,${Math.min(0.35, t)})`; ctx.fillRect(0, 0, W, H);
  const sc = 1 + Math.max(0, 0.6 - t * 2) * 1.5;
  ctx.save(); ctx.translate(W / 2, 250); ctx.scale(sc, sc); ctx.rotate(-0.06);
  T('BUSTED!', 0, 0, 64, '#ffd23f', 'center');
  ctx.restore();
  E('⛓️', W / 2, 150, 54);
  T(`${k.n} is under arrest!`, W / 2, 300, 22, '#fff', 'center');
  T(boss ? 'BOSS DEFEATED!' : `LEVEL ${level + 1} CLEARED!`, W / 2, 340, 28, '#7dffa0', 'center');
  T(`+${1000 * (level + 1) + (boss ? 2000 : 0)} pts   ·   +${30 + 20 * level} coins`, W / 2, 372, 16, '#ffe27a', 'center');
  T(level < LEVELS.length - 1 ? `Next up: ${LEVELS[level + 1].name}` : 'That was the last kid!', W / 2, 400, 14, '#cfe3ff', 'center');
}
function drawOver() {
  dim(0.72);
  const escaped = why === 'escape';
  T(escaped ? 'HE GOT AWAY!' : 'WIPED OUT!', W / 2, 220, 50, '#ff6b6b', 'center');
  T(escaped ? 'The suspect vanished into the city.' : 'You crashed and the suspect escaped.', W / 2, 262, 16, '#fff', 'center');
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(60, 300, W - 120, 190, 16); ctx.fill();
  T('SCORE', 90, 345, 16, '#cfe3ff', 'left'); T(String(scoreNow()), W - 90, 345, 26, '#fff', 'right');
  T('COINS', 90, 385, 16, '#cfe3ff', 'left'); T(String(coins), W - 90, 385, 26, '#ffe27a', 'right');
  T('ARRESTS', 90, 425, 16, '#cfe3ff', 'left'); T(String(arrests), W - 90, 425, 26, '#7dffa0', 'right');
  T('BEST', 90, 465, 16, '#cfe3ff', 'left'); T(String(Math.max(best, scoreNow())), W - 90, 465, 26, '#ffd23f', 'right');
  if (overT > 0.7) {
    glass(OVER_SHOP_BTN.x, OVER_SHOP_BTN.y, OVER_SHOP_BTN.w, OVER_SHOP_BTN.h, 14, 1.3, 'rgba(255,210,80,.7)');
    E('🛒', OVER_SHOP_BTN.x + 34, OVER_SHOP_BTN.y + 24, 20);
    T('SHOP (S)', OVER_SHOP_BTN.x + 62, OVER_SHOP_BTN.y + 31, 15, '#fff', 'left');
    if (Math.floor(time * 2) % 2 === 0) T(`TAP / SPACE: RETRY LEVEL ${level + 1}`, W / 2, 700, 18, '#fff', 'center');
  }
}

/* ============================================================
   INPUT
   ============================================================ */
addEventListener('keydown', e => {
  ensureAudio();
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if ((state === 'play' || state === 'paused') && (k === 'p' || k === 'P' || k === 'Escape')) { togglePause(); return; }
  if (state === 'menu') {
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') selectLevel(selLevel - 1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') selectLevel(selLevel + 1);
    else if (k === 's' || k === 'S') openShop('menu');
    else if (k === 'Enter' || k === ' ') start();
    return;
  }
  if (state === 'shop') {
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { shopSel = (shopSel + SHOP.length - 1) % SHOP.length; sfx.move(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { shopSel = (shopSel + 1) % SHOP.length; sfx.move(); }
    else if (k === 'Enter') buy(shopSel);
    else if (k === ' ' || k === 'Escape') shopDone();
    return;
  }
  if (state === 'over') {
    if (overT > 0.7) { if (k === 's' || k === 'S') openShop('over'); else if (k === 'Enter' || k === ' ') newGame(level); }
    return;
  }
  if (state === 'victory') {
    if (victoryT > 1) { if (k === 's' || k === 'S') openShop('menu'); else if (k === 'Enter' || k === ' ') toMenu(); }
    return;
  }
  if (state === 'paused') { if (k === 'Enter' || k === ' ') togglePause(); return; }
  if (state !== 'play') return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') jump();
  else if (k === 'ArrowDown' || k === 's' || k === 'S') rollAct();
});

let ptr = null;
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / cssScale, y = (e.clientY - r.top) / cssScale;
  if ((state === 'play' || state === 'paused') && x > W - 60 && y < 56) { togglePause(); return; }
  if (state === 'paused') { togglePause(); return; }
  if (state === 'menu') {
    if (inRect(x, y, MENU_L)) selectLevel(selLevel - 1);
    else if (inRect(x, y, MENU_R)) selectLevel(selLevel + 1);
    else if (inRect(x, y, MENU_SHOP)) openShop('menu');
    else {
      for (let i = 0; i < 5; i++) if (inRect(x, y, menuTile(i))) { selectLevel(i); return; }
      start();
    }
    return;
  }
  if (state === 'shop') { shopClick(x, y); return; }
  if (state === 'over') {
    if (overT > 0.7) { if (inRect(x, y, OVER_SHOP_BTN)) openShop('over'); else newGame(level); }
    return;
  }
  if (state === 'victory') { if (victoryT > 1) toMenu(); return; }
  ptr = { x: e.clientX, y: e.clientY };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!ptr || state !== 'play') return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (Math.abs(dx) > 28 || Math.abs(dy) > 28) {
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
    else if (dy < 0) jump(); else rollAct();
    ptr.x = e.clientX; ptr.y = e.clientY;
  }
});
const endPtr = () => { ptr = null; };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });
addEventListener('blur', () => { if (state === 'play') state = 'paused'; });

/* ============================================================
   LOOP
   ============================================================ */
init();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks, only available with ?debug in the URL
if (/[?&]debug/.test(location.search)) window.__game = { get state() { return state; }, get gap() { return gap; }, get score() { return scoreNow(); }, get level() { return level; }, get boss() { return boss; }, get hp() { return bossHP; }, get theme() { return LEVELS[level].name; }, save,
  get kidInTrain() { return !!trainUnder(kid.x, gap) && kid.y < 2.9; }, get kidOnRoof() { return kid.y > 2.9 && !!trainUnder(kid.x, gap); }, get kidY() { return kid.y; },
  giveJetpack() { items.push({ type: 'jetpack', lane: p.lane, x: laneX(p.lane), z: 0.2, y: 1, len: 0 }); }, get jetOn() { return jetOn; }, get missions() { return mis.map(m => m.def.txt(m.n)); },
  spawn(type, lane, z, extra) { items.push(Object.assign({ type, lane, x: laneX(lane), z, y: 1, len: 0.5 }, extra || {})); },
  start, move, jump, roll: rollAct, setGap: v => { gap = v; }, newGame, toMenu, buy, shopDone, openShop, selectLevel, levelComplete, setWallet: v => { save.wallet = v; }, get shield() { return p.shield; }, get turbo() { return turbo; } };
})();
